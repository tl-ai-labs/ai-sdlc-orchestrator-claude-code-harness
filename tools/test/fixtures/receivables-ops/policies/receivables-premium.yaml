# Receivables Ops · Pass 1 — every phase on Claude Opus 5.
# The premium ceiling: what this software costs with no cost-tiering at all,
# and the denominator for every savings % the study publishes.

version: 1
name: receivables-premium

models:
  - id: opus5
    adapter: builtin-anthropic
    model_name: claude-opus-5
    display_name: claude-opus-5
    # Opus 5 prices identically to Opus 4.7, which is what makes this study's
    # headline directly comparable to the Workforce Ops one.
    pricing: { input: 5.00, input_cached: 0.50, output: 25.00 }
    pricing_source: https://platform.claude.com/docs/en/docs/about-claude/pricing
    auth: { env: ANTHROPIC_API_KEY }

rules:
  - default: opus5
    reason: "Pass 1 baseline — single-model, premium tier"

# ─────────────────────────────────────────────────────────────
# Why this policy is shaped the way it is
# Receivables Ops · Pass 1 — every phase runs on Claude Opus 5.
# The premium ceiling: what this software costs with no cost-tiering at all.
# Its cost is the denominator for every savings % the study publishes, and its
# task plan is the playlist passes 2 and 3 replay, so the three legs compare
# like for like.
