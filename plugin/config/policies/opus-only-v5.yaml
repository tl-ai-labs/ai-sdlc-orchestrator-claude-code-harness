# Premium-ceiling baseline — every phase runs on Opus 5, no delegation.
# Successor to opus-only.yaml (which pinned claude-opus-4-7). Kept as a
# separate file so existing studies referencing opus-only still work.
version: 1
name: opus-only-v5

# Pricing blocks mirror the dated price list (plugin/mcp/model-dispatch/src/prices.ts),
# which bills every dispatch and the orchestrator's transcript; test/prices.test.mjs
# fails when a block drifts from it. A block is billed only under pricing_override: true.
# Estimated-mode telemetry reads load_policy's effective_price (the same list price),
# not this block: a block without pricing_override: true is documentation.
models:
  - id: opus
    adapter: builtin-anthropic
    model_name: claude-opus-5
    # Opus 5 list card: input 5.00 / cached 0.50 / output 25.00 per 1M; cache writes 1.25x (5m) or 2x (1h)
    # of input. Confirmed 2026-09-03 against Claude Code's own session receipts (two real runs,
    # reproduced to the cent; see tools/test/fixtures/receivables-ops).
    pricing:
      input: 5.00          # USD per 1M tokens
      input_cached: 0.50
      output: 25.00
    pricing_source: https://platform.claude.com/docs/en/about-claude/pricing
    pricing_last_verified: 2026-09-14
    auth:
      env: ANTHROPIC_API_KEY
    # Doubling loop clamps here; requests beyond this return 400.
    max_output_tokens_absolute: 32000

rules:
  # Brownfield-mode phases (added in the v1 brownfield extension). Explicit
  # rules rather than relying on the default, so telemetry rollups show the
  # routing decision was intentional per-phase.
  - when: { phase: discovery }
    use: opus
    reason: "Judgment: understanding an unknown repo is high-stakes; a wrong stack detection cascades"
  - when: { phase: change_plan }
    use: opus
    reason: "Judgment: delta design for brownfield feature-extend / refactor / deps"

  - default: opus
    reason: "Single-model, premium tier"

# Hard per-run cost cap. When the accumulated cost_usd across telemetry
# events for the current run exceeds this, the orchestrator aborts with
# a clear message. Prevents runaway spend on an unexpectedly large repo.
# Users on custom policies may raise or omit this.
hard_cost_cap_usd: 50

# 1h, like every shipped policy. Since 0.8.8 the orchestrator waits for reviewers and test
# suites inside its turn, so single-model runs wait too, and a 5m cache expires during those
# waits: the one 5m opus-only run on 0.8.x (kaneo Run 21, $17.43) cost more than every 1h
# opus-only run after it ($9.55–$14.18, Runs 22–35). The cost study's opus-only numbers were
# all measured at 1h (docs/cost-study/README.md). Enforced at run start by
# scripts/cache-ttl-check.mjs --fix, which writes .claude/settings.local.json for you.
subagent_cache_ttl: 1h
