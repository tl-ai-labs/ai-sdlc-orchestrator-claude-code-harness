# Multi-model — premium-judgment phases on Opus, high-volume mechanical
# work on Gemini 3.5 Flash. The pass that demonstrates cross-model routing.
version: 1
name: opus-plus-flash

models:
  - id: opus
    adapter: builtin-anthropic
    model_name: claude-opus-4-7
    pricing: { input: 5.00, input_cached: 0.50, output: 25.00 }
    pricing_source: https://platform.claude.com/docs/en/docs/about-claude/pricing
    pricing_last_verified: 2026-08-04
    auth: { env: ANTHROPIC_API_KEY }
    max_output_tokens_absolute: 32000
  - id: gemini-flash
    adapter: mcp:gemini-flash-server
    model_name: gemini-3.5-flash
    display_name: gemini-3.5-flash
    # The flat rate, which is what both default doors bill: AI Studio, and
    # Vertex on its "global" endpoint. Verified 2026-08-04 against both pages
    # below. Vertex adds +10% on every token class for REGIONAL endpoints
    # (Gemini 3 and later, effective 2026-07-01) — the adapter defaults to the
    # global endpoint so these numbers hold, and applies the surcharge to the
    # cost it reports if GOOGLE_CLOUD_LOCATION pins a region. Do not hand-edit
    # a x1.10 into this block; see applyVertexSurcharge in geminiTransports.ts.
    pricing: { input: 1.50, input_cached: 0.15, output: 9.00 }
    pricing_source: https://ai.google.dev/gemini-api/docs/pricing (AI Studio + Vertex global); https://cloud.google.com/vertex-ai/generative-ai/pricing (regional +10%)
    pricing_last_verified: 2026-08-04
    # Names the API-key env var for the AI Studio path. It is not a
    # requirement: when it is unset the adapter falls through to Vertex AI and
    # signs with Application Default Credentials instead — same model, same
    # rates, no key. See plugin/mcp/gemini-flash-server/src/adapters/geminiTransports.ts.
    auth: { env: GEMINI_API_KEY }
    max_output_tokens_absolute: 8192

rules:
  # Premium-judgment phases — stay on Opus
  - when: { phase: requirements_analysis }
    use: opus
    reason: "Judgment-heavy, low volume"
  - when: { phase: architecture_design }
    use: opus
    reason: "Foundational, decision-bearing"
  - when: { phase: plan_task_packets }
    use: opus
    reason: "Needs full context to slice work cleanly"
  - when: { phase: senior_code_review }
    use: opus
    reason: "Cross-file reasoning + judgment"
  - when: { phase: security_review }
    use: opus
    reason: "Risk-bearing, low volume"

  # High-volume mechanical phases — Gemini Flash
  - when:
      phase: codegen
      task_type:
        - controller_handler
        - service_method
        - dto
        - module_wiring
        - migration
        - seed_data
        - entity
        - guard
        - interceptor
        - filter
        - react_component
        - react_page
        - api_client
        - frontend_util
        - frontend_config
        - frontend_html
    use: gemini-flash
    reason: "Schema-driven boilerplate"
  - when: { phase: tests }
    use: gemini-flash
    reason: "Scaffold-heavy, pattern-based"
  - when: { phase: docs }
    use: gemini-flash
    reason: "Volume work"

  # Debug with escalation: try mechanical tier first, escalate to Opus after 2 retries
  - when: { phase: debug, retry_count: { gte: 2 } }
    use: opus
    reason: "Escalation: 2 mechanical-tier attempts failed"
  - when: { phase: debug }
    use: gemini-flash
    reason: "Most debugs have clear cause"

  - default: opus
    reason: "Unrecognized task — fail safe to premium"
